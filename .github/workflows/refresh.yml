# Optional: when the site is hosted from a GitHub repository, this refreshes the
# data every 8 hours in the cloud and commits it, so the published site stays
# current without this computer being on. Add a free FEC API key as the
# repository secret FEC_API_KEY for full fundraising data.
name: Refresh election data

on:
  schedule:
    - cron: "15 */8 * * *"   # every 8 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore page cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: refresh-cache-${{ github.run_id }}
          restore-keys: refresh-cache-
      - name: Refresh races, forecasts, control odds and news
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python scripts/refresh_all.py
      - name: Commit updated data
        run: |
          git config user.name "informed-voter-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add data/races.json data/control.json data/status.json data/news.json data/inflation.json data/research
          git diff --cached --quiet || git commit -m "Refresh election data"
          git push
