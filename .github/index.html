<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Informed Voter</title>
  <meta name="description" content="A nonpartisan guide to the 2026 U.S. elections: every race on the map, your own ballot from your address, and the candidates who share your views.">
  <meta name="theme-color" content="#0b0912">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try {
      var saved = JSON.parse(localStorage.getItem('iv:v1') || '{}');
      if (saved.theme) document.documentElement.dataset.theme = saved.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="topbar" id="topbar"></div>
  <header class="site-header" id="site-header"></header>
  <div class="ticker" id="ticker" aria-label="Closest races"></div>
  <div class="demo-banner" id="demo-banner" role="note"></div>
  <main id="app" tabindex="-1">
    <div class="wrap page"><p class="muted">Loading Informed Voter&hellip;</p>
      <p class="small faint">If this message stays, the site was probably opened by double-clicking <code>index.html</code>. Browsers block that; start it through a local web server instead (see README.md).</p></div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <div id="overlay-root"></div>
  <script src="vendor/d3.v7.9.0.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
